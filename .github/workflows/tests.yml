name: Transport tests
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax and source entry point
        run: |
          python -m compileall -q src subchats.py
          python subchats.py --help
      - name: Transport regression tests (no model calls)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed entry point
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          codex-subchats --help
