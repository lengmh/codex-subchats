[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-subchats"
version = "0.1.0a1"
description = "Experimental local independent Codex sessions and queue wake validation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
codex-subchats = "codex_subchats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
